spring:
  datasource:
    # Берём из ENV, а по умолчанию — docker-хост БД
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ewm-main-db:5432/ewm_main_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # В CI/Docker — none (только валидация/инициализация через schema.sql)
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: true
    properties:
      hibernate.format_sql: true
    open-in-view: false

  sql:
    init:
      # Включаем выполнение schema.sql (ENV может переопределить)
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

stats:
  service:
    # Берём из ENV, а дефолт — имя контейнера stats-сервера
    url: ${STATS_SERVICE_URL:http://ewm-stats-server:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  server:
    port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
